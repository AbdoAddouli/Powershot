<template>
  <div class="auth-shell">
    <c-custom-brand-panel variant={variant}></c-custom-brand-panel>

    <main class="nf-main">
      <template lwc:if={checking}>
        <div class="auth-checking" role="status">
          <span class="spinner"></span>
          <span class="checking-text">Checking…</span>
        </div>
      </template>

      <template lwc:else>
      <div class="nf-card">
        <!-- Illustration 404 -->
        <div class="nf-art" aria-hidden="true">
          <div class="nf-ring nf-ring-1"></div>
          <div class="nf-ring nf-ring-2"></div>

          <div class="nf-well">
            <span class="nf-digit">4</span>
            <span class="nf-core">
              <svg
                viewBox="0 0 48 48"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="nf-oil"
              >
                <path
                  d="M24 4c6 8 12 14.5 12 21A12 12 0 0 1 12 25c0-6.5 6-13 12-21Z"
                  fill="#008542"
                />
                <path
                  d="M18 25a6 6 0 0 0 6 6"
                  stroke="#c5e9d4"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <circle
                  cx="24"
                  cy="24"
                  r="21"
                  stroke="#2d5a91"
                  stroke-width="1.5"
                  stroke-dasharray="4 5"
                />
              </svg>
            </span>
            <span class="nf-digit">4</span>
          </div>

          <span class="nf-drip nf-drip-1"></span>
          <span class="nf-drip nf-drip-2"></span>
          <span class="nf-drip nf-drip-3"></span>
        </div>

        <!-- Message -->
        <span class="ps-badge">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="badge-icon"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4" />
            <path d="M12 16h.01" />
          </svg>
          404 · Page not found
        </span>

        <h2 class="nf-title">This well has run dry.</h2>
        <p class="nf-subtitle">
          We drilled everywhere and couldn't find that page. It may have been
          moved, renamed, or never existed. Let's get you back on solid ground.
        </p>

        <!-- Actions -->
        <div class="nf-actions">
          <template lwc:if={isLoggedIn}>
            <button
              type="button"
              class="ps-btn ps-btn-primary"
              onclick={goHome}
            >
              <span class="btn-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                  <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
              </span>
              Back to Home
            </button>
            <button
              type="button"
              class="ps-btn ps-btn-secondary"
              onclick={goBack}
            >
              <span class="btn-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m12 19-7-7 7-7" />
                  <path d="M19 12H5" />
                </svg>
              </span>
              Previous page
            </button>
          </template>

          <template lwc:else>
            <button
              type="button"
              class="ps-btn ps-btn-primary"
              onclick={goLogin}
            >
              <span class="btn-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
              </span>
              Sign In
            </button>
          </template>
        </div>

        <template lwc:if={isLoggedIn}>
          <p class="nf-foot">
            Need to get back?&nbsp;
            <a class="ps-link-strong" href={homeUrl} onclick={goHome}>
              Return to the PowerShot portal
            </a>
          </p>
        </template>
        <template lwc:else>
          <p class="nf-foot">
            Already a partner?&nbsp;
            <a class="ps-link-strong" href={loginUrl} onclick={goLogin}>
              Return to sign in
            </a>
          </p>
        </template>
        <p class="ps-foot-note">
          Protected by PowerShot Security · ISO 27001 aligned
        </p>
      </div>
      </template>
    </main>
  </div>
</template>
