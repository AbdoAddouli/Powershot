<template>
  <lightning-card icon-name="custom:custom12">
    <h2 class="card-title" slot="title">Billing &amp; Royalties</h2>
    <template if:true="{hasError}">
      <div class="slds-box slds-theme_error slds-m-around_medium">
        <p>{errorMessage}</p>
      </div>
    </template>

    <template if:false="{hasError}">
      <div class="kpi-row">
        <div class="kpi stat-blue">
          <div class="kpi-gauge">
            <span class="kpi-val">{totalInvoices}</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-label">Total Invoices</div>
            <div class="kpi-sub">On file</div>
          </div>
        </div>
        <div class="kpi stat-orange">
          <div class="kpi-gauge">
            <span class="kpi-val">{outstandingDisplay}</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-label">Outstanding</div>
            <div class="kpi-sub warn">Awaiting payment</div>
          </div>
        </div>
        <div class="kpi stat-red">
          <div class="kpi-gauge">
            <span class="kpi-val">{overdueDisplay}</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-label">Overdue</div>
            <div class="kpi-sub">Due immediately</div>
          </div>
        </div>
        <div class="kpi stat-teal">
          <div class="kpi-gauge">
            <span class="kpi-val">{royaltyDisplay}</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-label">Royalty (12mo)</div>
            <div class="kpi-sub">Last 12 months</div>
          </div>
        </div>
      </div>

      <div class="slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_small section-title">
          Invoices
        </h2>
        <template if:true="{hasInvoices}">
          <div class="table-card">
            <c-portal-data-table
              records="{invoices}"
              columns="{invoiceColumns}"
              key-field="Id"
            ></c-portal-data-table>
          </div>
        </template>
        <template if:false="{hasInvoices}">
          <div class="slds-box slds-theme_shade slds-m-top_small">
            <p>No invoices found.</p>
          </div>
        </template>
      </div>

      <div class="slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_small section-title">
          Royalty Statements
        </h2>
        <template if:true="{hasRoyalties}">
          <div class="table-card">
            <c-portal-data-table
              records="{royaltyStatements}"
              columns="{royaltyColumns}"
              key-field="Id"
            ></c-portal-data-table>
          </div>
        </template>
        <template if:false="{hasRoyalties}">
          <div class="slds-box slds-theme_shade slds-m-top_small">
            <p>No royalty statements found.</p>
          </div>
        </template>
      </div>
    </template>
  </lightning-card>
</template>
