<template>
  <aside class={sidebarClass}>
    <div class="ps-sidebar-grid"></div>
    <div class="ps-sidebar-glow"></div>

    <div class="ps-sidebar-inner">
      <!-- Logo -->
      <div
        class="ps-side-logo-block"
        onclick={goHome}
        role="button"
        tabindex="0"
        onkeydown={handleLogoKey}
        aria-label="PowerShot – Home"
      >
        <div class="ps-side-logo" aria-hidden="true">
          <svg
            viewBox="0 0 48 48"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="24" cy="24" r="22" fill="#1B365D"></circle>
            <circle
              cx="24"
              cy="24"
              r="22"
              stroke="#2d5a91"
              stroke-width="1"
            ></circle>
            <path
              d="M27.5 9 14 26.5h8.2L20 39l13.5-17.5h-8.2L27.5 9Z"
              fill="#008542"
            ></path>
            <path
              d="M27.5 9 14 26.5h8.2L20 39l13.5-17.5h-8.2L27.5 9Z"
              stroke="#FFFFFF"
              stroke-opacity="0.25"
              stroke-width="0.75"
              stroke-linejoin="round"
            ></path>
          </svg>
        </div>
        <template lwc:if={expanded}>
          <div class="ps-side-logo-name">
            <p class="ps-side-wordmark">
              Power<b class="ps-side-green">Shot</b>
            </p>
            <p class="ps-side-tagline">Partner Portal</p>
          </div>
        </template>
      </div>

      <!-- Collapse toggle -->
      <button
        class="ps-collapse-btn"
        onclick={toggleCollapse}
        aria-label={collapseAriaLabel}
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>

      <!-- Navigation -->
      <nav class="ps-side-nav" aria-label="Sidebar navigation">
        <template for:each={decoratedNavItems} for:item="item">
          <button
            key={item.key}
            class={item.className}
            data-page={item.pageName}
            onclick={handleNavClick}
            aria-label={item.label}
            aria-current={item.ariaCurrent}
            title={item.linkTitle}
          >
            <span class="ps-side-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <template lwc:if={item.isHome}>
                  <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </template>
                <template lwc:if={item.isDashboard}>
                  <rect width="7" height="9" x="3" y="3" rx="1" />
                  <rect width="7" height="5" x="14" y="3" rx="1" />
                  <rect width="7" height="9" x="14" y="12" rx="1" />
                  <rect width="7" height="5" x="3" y="16" rx="1" />
                </template>
                <template lwc:if={item.isWell}>
                  <path d="M12 2v8" />
                  <path d="m4.93 10.93 1.41 1.41" />
                  <path d="M2 18h2" />
                  <path d="M20 18h2" />
                  <path d="m19.07 10.93-1.41 1.41" />
                  <path d="M22 22H2" />
                  <path d="m8 22 4-10 4 10" />
                </template>
                <template lwc:if={item.isBilling}>
                  <rect width="20" height="14" x="2" y="5" rx="2" />
                  <line x1="2" x2="22" y1="10" y2="10" />
                </template>
                <template lwc:if={item.isCompliance}>
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
                  <path d="m9 12 2 2 4-4" />
                </template>
                <template lwc:if={item.isHse}>
                  <path
                    d="M10.1 2.18a10.93 10.93 0 0 1 3.8 0 2 2 0 0 0 2.66 1.41 2 2 0 0 1 2.74 2.74 2 2 0 0 0 1.41 2.66 10.93 10.93 0 0 1 0 3.8 2 2 0 0 0-1.41 2.66 2 2 0 0 1-2.74 2.74 2 2 0 0 0-2.66 1.41 10.93 10.93 0 0 1-3.8 0 2 2 0 0 0-2.66-1.41 2 2 0 0 1-2.74-2.74 2 2 0 0 0-1.41-2.66 10.93 10.93 0 0 1 0-3.8 2 2 0 0 0 1.41-2.66 2 2 0 0 1 2.74-2.74 2 2 0 0 0 2.66-1.41Z"
                  />
                </template>
              </svg>
            </span>
            <template lwc:if={expanded}>
              <span class="ps-side-label">{item.label}</span>
            </template>
            <template lwc:if={item.active}>
              <span class="ps-side-active-dot"></span>
            </template>
          </button>
        </template>
      </nav>

      <!-- Bottom: User profile -->
      <div class="ps-side-bottom">
        <button
          class="ps-side-user"
          onclick={toggleProfileMenu}
          aria-expanded={profileOpen}
          aria-haspopup="menu"
        >
          <div class="ps-side-avatar">
            <span class="ps-side-avatar-initial">{userInitial}</span>
          </div>
          <template lwc:if={expanded}>
            <div class="ps-side-user-info">
              <p class="ps-side-user-name">{displayName}</p>
              <p class="ps-side-user-email">{displayEmail}</p>
            </div>
            <span class={chevronClass}>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </span>
          </template>
        </button>

        <template lwc:if={profileOpen}>
          <div lwc:if={expanded} class="ps-side-user-menu" role="menu">
            <button
              class="ps-side-menu-item"
              role="menuitem"
              onclick={goProfile}
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="ps-side-item-icon"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              My Profile
            </button>
            <button
              class="ps-side-menu-item ps-side-menu-danger"
              role="menuitem"
              onclick={handleLogout}
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="ps-side-item-icon"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Log out
            </button>
          </div>
        </template>
      </div>
    </div>
  </aside>
</template>
