<template>
  <div class="auth-shell">
    <c-custom-brand-panel variant="renewable"></c-custom-brand-panel>

    <main class="auth-main">
      <div class="auth-card">
        <button class="ps-back" onclick={goBack}>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          Back to sign in
        </button>

        <div class="header-section">
          <span class="hero-icon-wrap">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="hero-icon"
            >
              <path
                d="M22 13a6 6 0 0 1-7.1 5.91 6 6 0 0 0-8.8-8.8A6 6 0 0 1 13 1.88"
              />
              <path d="m21.64 3.64-9.2 9.2-1.4-3.9-1.4 3.9-9.2-9.2" />
              <path d="M13.32 12.84 9.8 13.4l.56-3.52" />
            </svg>
          </span>
          <h2 class="ps-title">Forgot your password?</h2>
          <p class="ps-subtitle">
            Enter your work email and we'll send you a secure link to reset it.
          </p>
        </div>

        <form onsubmit={handleSubmit} novalidate>
          <div class="ps-field">
            <label class="ps-label" for="email"
              >Work email <span class="req">*</span></label
            >
            <div class="input-wrap">
              <span class="leading-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
              </span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@company.com"
                class="ps-input pl-10 {error ? 'ps-input-error' : ''}"
                value={email}
                oninput={handleInput}
                aria-required="true"
                aria-invalid={emailInvalid}
                aria-describedby="forgot-email-error"
              />
            </div>
            <p id="forgot-email-error" class="ps-error-text" role="alert">
              <template lwc:if={error}>{error}</template>
            </p>
          </div>

          <button
            type="submit"
            class="ps-btn ps-btn-primary"
            disabled={loading}
          >
            <template lwc:if={loading}>
              <span class="spinner"></span>
              Sending…
            </template>
            <template lwc:else>Send reset link</template>
          </button>

          <p class="ps-foot-note">
            If you don't receive an email within 10 minutes, check your spam
            folder or contact your PowerShot administrator.
          </p>
        </form>
      </div>
    </main>
  </div>
</template>
