<template>
    <lightning-card title="HSE Incidents" icon-name="standard:case">
        <div class="slds-m-around_medium">
            <template if:true={hasError}>
                <div class="slds-box slds-box_x-small slds-theme_error slds-text-color_inverse">
                    <p>Error loading incidents.</p>
                </div>
            </template>
            <template if:false={hasError}>
                <template if:true={hasIncidents}>
                    <lightning-datatable
                        key-field="Id"
                        data={incidents}
                        columns={columns}
                        hide-checkbox-column="true"
                        default-sort-direction="desc"
                        sorted-by="Incident_Date__c">
                    </lightning-datatable>
                </template>
                <template if:false={hasIncidents}>
                    <div class="slds-illustration slds-illustration_small">
                        <lightning-icon icon-name="standard:case" size="large"></lightning-icon>
                        <h3 class="slds-illustration__header slds-text-heading_medium">No Incidents</h3>
                        <p class="slds-illustration__body slds-text-body_regular">No HSE incidents recorded.</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
